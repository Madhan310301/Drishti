<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="lib/leaflet.awesome-markers.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0;
      background: #0c1322; font-family: 'Segoe UI', system-ui, sans-serif; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%;
      background: #0c1322; }
    .leaflet-container { background: #0c1322; font-size: 1rem; }
    .info-legend { position: absolute; bottom: 16px; right: 16px; z-index: 1000;
      background: rgba(18,26,46,0.9); color: #e6f1ff; padding: 10px 14px;
      border: 1px solid rgba(0,212,255,0.3); border-radius: 10px; font-size: 12px;
      line-height: 1.6; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle; }
    .map-title { position: absolute; top: 14px; left: 16px; z-index: 1000;
      color: #e6f1ff; font-size: 15px; font-weight: 700; letter-spacing: 1px;
      text-shadow: 0 2px 6px #000; }
  </style>
</head>
<body>
  <div class="map-title">🛡️ KARNATAKA · CRIME HOTSPOT MAP</div>
  <div id="map"></div>
  <div class="info-legend">
    <div><b>Risk level</b></div>
    <div><span class="dot" style="background:#ff3b5c"></span>Critical (≥80)</div>
    <div><span class="dot" style="background:#ffb454"></span>High (50–79)</div>
    <div><span class="dot" style="background:#ffd166"></span>Medium (25–49)</div>
    <div><span class="dot" style="background:#36e2a0"></span>Low (&lt;25)</div>
    <div style="margin-top:6px;opacity:.7;">Circle size ∝ risk score</div>
  </div>

  <script src="lib/jquery.js"></script>
  <script src="lib/leaflet.js"></script>
  <script src="lib/leaflet.awesome-markers.js"></script>
  <script>
    // Self-contained hotspot map — no external tiles/CDN required.
    // Karnataka centroid ~ [15.0, 76.0]; bounds cover the state.
    var map = L.map('map', { center: [15.0, 76.0], zoom: 7, zoomControl: true })
      .setView([15.0, 76.0], 7);

    // Subtle graticule-style background grid (pure CSS/vector, offline).
    var grid = L.layerGroup().addTo(map);
    for (var lat = 11; lat <= 19; lat += 1) {
      L.polyline([[lat, 73], [lat, 80]], { color: '#1d2c4a', weight: 1, opacity: 0.6 }).addTo(grid);
    }
    for (var lon = 73; lon <= 80; lon += 1) {
      L.polyline([[11, lon], [19, lon]], { color: '#1d2c4a', weight: 1, opacity: 0.6 }).addTo(grid);
    }
    // Karnataka outline (approximate polygon) for context.
    var karnataka = [[18.2,74.1],[17.9,75.7],[16.7,77.0],[15.8,78.3],[14.0,78.8],[13.0,79.0],[12.2,78.3],[11.7,77.2],[12.0,76.4],[13.0,75.7],[14.2,74.5],[15.5,74.0],[16.8,74.5],[18.2,74.1]];
    L.polygon([karnataka], { color: '#00d4ff', weight: 1.5, fillColor: '#0a2540', fillOpacity: 0.15 }).addTo(map);

    function riskColor(r) {
      if (r >= 80) return '#ff3b5c';
      if (r >= 50) return '#ffb454';
      if (r >= 25) return '#ffd166';
      return '#36e2a0';
    }

    // Hotspot data (district center coords + risk). Same source as backend.
    var hotspots = [
      {d:'Bangalore', lat:12.9716, lon:77.5946, risk:100.0, hs:85.8, fc:4678, an:1.000},
      {d:'Ramanagara', lat:12.7167, lon:77.2833, risk:19.9, hs:19.6, fc:1034, an:0.321},
      {d:'Bangalore Rural', lat:13.2833, lon:77.9167, risk:17.0, hs:14.8, fc:678, an:0.369},
      {d:'Dharwad', lat:15.4583, lon:75.0167, risk:16.6, hs:17.6, fc:871, an:0.272},
      {d:'Chikkaballapura', lat:13.4333, lon:77.7333, risk:15.4, hs:15.0, fc:826, an:0.307},
      {d:'Shimoga', lat:13.9333, lon:75.5667, risk:12.8, hs:16.0, fc:624, an:0.220},
      {d:'Chikmagalur', lat:13.3167, lon:75.7667, risk:12.6, hs:12.9, fc:734, an:0.186},
      {d:'Udupi', lat:13.3333, lon:74.7500, risk:12.2, hs:8.9, fc:342, an:0.512},
      {d:'Dakshina Kannada', lat:12.8500, lon:75.0833, risk:11.9, hs:10.2, fc:469, an:0.374},
      {d:'Mysore', lat:12.3000, lon:76.6500, risk:11.6, hs:16.2, fc:599, an:0.200},
      {d:'Chitradurga', lat:14.2333, lon:76.4000, risk:10.1, hs:13.4, fc:573, an:0.158},
      {d:'Hassan', lat:13.0000, lon:76.1000, risk:10.1, hs:13.3, fc:519, an:0.189},
      {d:'Koppal', lat:15.3500, lon:76.1500, risk:9.5, hs:12.5, fc:548, an:0.207},
      {d:'Yadgir', lat:16.2000, lon:77.1333, risk:9.5, hs:14.5, fc:277, an:0.435},
      {d:'Gadag', lat:15.4167, lon:75.6333, risk:9.2, hs:11.9, fc:573, an:0.163},
      {d:'Tumkur', lat:13.3333, lon:77.1000, risk:9.0, hs:12.6, fc:548, an:0.127},
      {d:'Uttara Kannada', lat:14.9167, lon:74.5000, risk:8.6, hs:9.9, fc:429, an:0.197},
      {d:'Gulbarga', lat:17.3333, lon:76.8333, risk:7.7, hs:15.1, fc:439, an:0.129},
      {d:'Bidar', lat:17.9167, lon:77.5167, risk:7.6, hs:12.9, fc:342, an:0.200},
      {d:'Raichur', lat:16.2000, lon:77.3500, risk:7.2, hs:14.7, fc:364, an:0.179},
      {d:'Bellary', lat:15.1500, lon:76.9333, risk:6.8, hs:13.0, fc:402, an:0.142},
      {d:'Bijapur', lat:16.8167, lon:75.7167, risk:6.5, hs:11.8, fc:388, an:0.118},
      {d:'Bagalkot', lat:16.1833, lon:75.7167, risk:6.1, hs:10.4, fc:355, an:0.150},
      {d:'Kolar', lat:13.1333, lon:78.1333, risk:5.9, hs:9.7, fc:312, an:0.137},
      {d:'Chamarajanagar', lat:11.9333, lon:76.9333, risk:5.4, hs:8.3, fc:298, an:0.110},
      {d:'Mandya', lat:12.5167, lon:76.9000, risk:5.1, hs:8.0, fc:301, an:0.095},
      {d:'Haveri', lat:14.8000, lon:75.3500, risk:4.8, hs:7.6, fc:289, an:0.101},
      {d:'Belgaum', lat:15.8500, lon:74.5000, risk:4.2, hs:6.9, fc:271, an:0.088}
    ];

    hotspots.forEach(function (h) {
      var radius = 6 + (h.risk / 100) * 22;  // visual size by risk
      L.circleMarker([h.lat, h.lon], {
        radius: radius,
        color: riskColor(h.risk),
        fillColor: riskColor(h.risk),
        fillOpacity: 0.55,
        weight: 2
      }).addTo(map).bindPopup(
        '<b>' + h.d + '</b><br>Risk score: ' + h.risk.toFixed(1) +
        '<br>Hotspot score: ' + h.hs +
        '<br>Crime forecast: ' + h.fc +
        '<br>Anomaly: ' + h.an.toFixed(3)
      );
    });
  </script>
</body>
</html>
